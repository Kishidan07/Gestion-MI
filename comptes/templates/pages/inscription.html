{% load static %}

<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PAGE LOGIN</title>
        <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'pages/style.css' %}">
        <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Roboto&display=sawp"rel="stylesheet">
        <link rel="stylesheet" href="{% static 'style/style.css' %}">
        
        <body>
        <div class="container">
            <div class="separation">
                <h1>Bonjour, Bienvenue!</h1>
                <p>Avez-vous un compte?</p>
                <a href="{% url 'connexion' %}">
                    <button type="submit" class="connexion">Se connecter</button>
                </a>
            </div>
            <form action="{% url 'inscription' %}" method="post">
                {% csrf_token %}
                <h1 class="inscription">Inscription</h1>
                {% if messages %}
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                {% endif %}
                <div class="case">
                    <i class="bi bi-person"></i>
                    <input type="text" name="nom" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="case">
                    <i class="bi bi-lock"></i>
                    <button type="button" onclick="afficherCacher()" class="oeil">
                        <i class="bi bi-eye-slash" id="icone"></i>
                    </button>
                    <input name="mdp" type="password" id="mdp" placeholder="Mot de passe" required>
                </div>

              <div class="case">
                    <i class="bi bi-lock"></i>
                    <button type="button" onclick="Affichercacher()" class="oeil">
                        <i class="bi bi-eye-slash" id="icone2"></i>
                    </button>
                    <input name="mdp2" type="password" id="mdp2" placeholder="Confirmer le mot de passe" required>
                </div>
                    <button type="submit" class="creation">Créer un compte</button>
                <a href="{% url 'acceuil' %}">
                <button type="reset" class="Annuler">Annuler</button>
                </a>
            </form>
        </div>


        <script>
            function afficherCacher(){
                let mdp= document.getElementById("mdp");
                let icone= document.getElementById("icone");
                if (mdp.type==="password"){
                    mdp.type="text";
                    icone.className="bi bi-eye";
                }
                else{
                    mdp.type="password";
                    icone.className= "bi bi-eye-slash";
                }
            }
            function Affichercacher(){
                let mdp= document.getElementById("mdp2");
                let icone= document.getElementById("icone2");
                if (mdp.type==="password"){
                    mdp.type="text";
                    icone.className="bi bi-eye";
                }
                else{
                    mdp.type="password";
                    icone.className="bi bi-eye-slash";
                }
            }
        </script>

    </body>
