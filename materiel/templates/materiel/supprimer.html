{% load static %}
<!DOCTYPE html>
<html lang="fr">
    <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width,initial-scale=1.0">
         <title>Supprimer un materiel</title>
         <link rel="stylesheet" href="{% static 'style/supprimer.css' %}">
    </head>
    <body>
        <div class="container">
            <div>
                  <h2>Confirmation de suppression</h2>
            </div>
            <div>
                 <p>Voulez-vous vraiment supprimer {{materiel.marque}} de numéro {{materiel.numero}}?</p>
            </div>
            <div class="oui_non">
                 <form method="POST">
                     {%csrf_token%}
                     <button type="submit">Oui,supprimer</button>
                 </form>
                 <a href="{% url 'liste_materiels' %}">Annuler</a>
            </div>
        </div>
        </body>
        </html>
