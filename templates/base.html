{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}GMI{% endblock %}</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{% static 'style/base.css' %}">

    {% block css %}
    {% endblock %}

</head>

<body class="{% block body_class %}page-accueil{% endblock %}">

    <header class="navbar">

        <a href="{% url 'acceuil' %}" class="logo">
            <i class="bi bi-pc-display"></i>
            <span>GMI</span>
        </a>

        <button type="button" class="menu-toggle"
                onclick="ouvrirMenu()"
                aria-label="Ouvrir le menu">

            <i class="bi bi-list"></i>

        </button>

        <nav class="liens" id="liens">

    {% with page=request.resolver_match.url_name %}

    <a href="{% url 'acceuil' %}"
       class="{% if page == 'acceuil' %}actif{% endif %}">
        <i class="bi bi-speedometer2"></i>
        Tableau de bord
    </a>

    <a href="{% url 'liste_materiels' %}"
       class="{% if page == 'liste_materiels' or page == 'ajouter_materiel' or page == 'modifier_materiel' %}actif{% endif %}">
        <i class="bi bi-laptop"></i>
        Matériel
    </a>

    <a href="{% url 'liste_intervenants' %}"
       class="{% if page == 'liste_intervenants' or page == 'ajouter_intervenant' or page == 'modifier_intervenant' %}actif{% endif %}">
        <i class="bi bi-people"></i>
        Intervenants
    </a>

    <a href="{% url 'liste_entretiens' %}"
        class="{% if page == 'liste_entretiens' %}actif{% endif %}">
        <i class="bi bi-wrench-adjustable"></i>
        Entretiens
    </a>

    <a href="{% url 'liste_rapports' %}"
        class="{% if page == 'liste_intervenants' or page == 'ajouter_intervenant' or page == 'modifier_intervenant' %}actif{% endif %}">
        <i class="bi bi-file-earmark-bar-graph"></i>
        Rapports
    </a>

    {% endwith %}

</nav>
        <div class="utilisateur">

            <span class="nom">
                <i class="bi bi-person-circle"></i>
                {{ user.username|default:"Invité" }}
            </span>

            <a href="{% url 'connexion' %}"
               class="deconnexion"
               title="Se déconnecter">

                <i class="bi bi-box-arrow-right"></i>

            </a>

        </div>

    </header>

    <!-- ===== CONTENU VARIABLE ===== -->

    <main class="contenu">

        {% block content %}
        {% endblock %}

    </main>

    <!-- MENU RESPONSIVE -->

    <script>

        function ouvrirMenu() {
            document.getElementById("liens").classList.toggle("ouvert");
        }

    </script>

</body>
</html>
